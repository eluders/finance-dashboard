<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- Only our own scripts may run, and the page may only talk to GitHub's and Anthropic's APIs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com https://api.anthropic.com; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finance Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Finance</div>
      <nav class="tabs">
        <a href="#summary" data-tab="summary">Summary</a>
        <a href="#transactions" data-tab="transactions">Transactions</a>
        <a href="#logs" data-tab="logs">Logs</a>
        <a href="#settings" data-tab="settings">Settings</a>
      </nav>
      <div class="spacer"></div>
      <span id="saveState"></span>
      <button id="saveNow" disabled>Save now</button>
      <button id="reload" class="icon-btn" title="Reload from GitHub">↻</button>
    </div>
  </header>

  <main>
    <div id="failedEdits" class="box warn" hidden><span id="failedText"></span><button id="dismissFailed">Dismiss</button></div>
    <div id="status" class="status"></div>

    <section id="tab-summary" hidden>
      <div class="toolbar">
        <button id="sumPred" class="toggle-btn" aria-pressed="true" title="Show or hide the prediction row under each category">Predictions</button>
        <select id="sumYear" title="Financial year (named by the year it ends in)"></select>
        <span id="sumRange" class="muted"></span>
        <select id="sumAccount" title="Account"><option value="">All accounts</option></select>
        <div class="spacer"></div>
        <button id="editCategories">Edit categories</button>
      </div>
      <div id="summaryBody"></div>
    </section>

    <section id="tab-transactions" hidden>
      <div class="toolbar" id="txToolbar">
        <select id="filterAccount" title="Account"><option value="">All accounts</option></select>
        <div id="filterCategoryBox"></div>
        <select id="filterDate" title="Date"></select>
        <span id="dateRange" class="row" hidden><input id="dateFrom" type="date" title="From" /> – <input id="dateTo" type="date" title="To" /></span>
        <input id="search" type="search" placeholder="Search description or note" />
        <span id="count" class="muted"></span>
        <div class="spacer"></div>
        <button id="aiOpen" class="primary" title="Let AI categorize the transactions shown">✨ AI categorize</button>
      </div>
      <div id="reviewBanner" class="review-banner" hidden></div>
      <div id="txns"></div>
    </section>

    <section id="tab-logs" hidden>
      <div class="toolbar"><h2>AI categorize sessions</h2></div>
      <div id="logsList"></div>
    </section>

    <section id="tab-settings" hidden>
      <div id="settingsPanel" class="card"></div>
      <div id="aiSettingsPanel" class="card"></div>
      <div id="yearPanel" class="card"></div>
      <div id="accountPanel" class="card"></div>
      <div id="backupPanel" class="card"></div>
    </section>
  </main>
  <aside id="aiPanel" class="ai-panel" aria-label="AI categorize"></aside>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
